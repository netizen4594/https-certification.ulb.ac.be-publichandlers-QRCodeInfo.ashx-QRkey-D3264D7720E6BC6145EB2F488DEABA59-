<html lang="fr" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">

<title>Florian</title>
<style>
:root{--bg:#fff;--fg:#111;--mute:#888;--line:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:960px;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.photo{display:block;max-width:100%}.full{width:100%;height:auto;max-height:90vh;object-fit:contain}
.round,.square{width:min(560px,92vw);aspect-ratio:1;object-fit:cover}.round{border-radius:50%}.square{border-radius:8px}
.ph{width:min(320px,80vw);aspect-ratio:1;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px}
h1{font-size:28px;margin:0}p{font-size:17px;line-height:1.5;margin:0;white-space:pre-wrap}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer}
button.main{background:#111;color:#fff;border-color:#111}
.blk{width:100%;display:flex;gap:8px;align-items:flex-start}
.blk textarea{flex:1;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;resize:vertical;min-height:44px;background:var(--bg);color:var(--fg)}
#ctl{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px)}
</style>
</head>

<script>
const S = JSON.parse(document.getElementById('state').textContent);
const app = document.getElementById('app');
let edit = false, art = null, owner = false;

function el(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
function btn(label, fn, cls){ const b = el('button', cls, label); b.onclick = fn; return b; }

function render(){
  app.innerHTML = '';
  const m = el('main');
  if (S.photo) { const i = el('img', 'photo ' + S.shape); i.src = S.photo; i.alt = 'Photo'; m.appendChild(i); }
  else if (edit) m.appendChild(el('div', 'ph', 'Ta photo ici'));

  S.blocks.forEach((b, i) => {
    if (!edit) { m.appendChild(el(b.t === 'h' ? 'h1' : 'p', '', b.v)); return; }
    const row = el('div', 'blk');
    const ta = el('textarea'); ta.value = b.v; ta.placeholder = b.t === 'h' ? 'Titre' : 'Texte';
    ta.oninput = () => { b.v = ta.value; };
    row.appendChild(ta);
    row.appendChild(btn('Suppr.', () => { S.blocks.splice(i, 1); render(); }));
    m.appendChild(row);
  });

  if (edit) {
    const bar = el('div', 'bar');
    const f = el('input'); f.type = 'file'; f.accept = 'image/*'; f.style.display = 'none';
    f.onchange = () => loadPhoto(f.files[0]);
    bar.appendChild(f);
    bar.appendChild(btn('Changer la photo', () => f.click()));
    const L = {full:'Forme : originale', round:'Forme : ronde', square:'Forme : carrée'};
    bar.appendChild(btn(L[S.shape] || L.full, () => { S.shape = S.shape === 'full' ? 'round' : S.shape === 'round' ? 'square' : 'full'; render(); }));
    bar.appendChild(btn('+ Titre', () => { S.blocks.push({t:'h', v:''}); render(); }));
    bar.appendChild(btn('+ Texte', () => { S.blocks.push({t:'p', v:''}); render(); }));
    m.appendChild(bar);
  }
  app.appendChild(m);

  if (owner) {
    const c = el('div', 'bar'); c.id = 'ctl';
    if (!edit) c.appendChild(btn('Modifier', () => { edit = true; render(); }));
    else {
      c.appendChild(btn('Annuler', () => location.reload()));
      c.appendChild(btn('Télécharger la page', save, 'main'));
    }
    app.appendChild(c);
  }
}

function loadPhoto(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      S.photo = cv.toDataURL('image/jpeg', 0.85);
      render();
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

async function save(){
  try {
    S.blocks = S.blocks.filter(b => b.v.trim());
    const c = document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML = '';
    c.querySelector('#state').textContent = JSON.stringify(S).replace(/</g, '\\u003c');
    const blob = new Blob(['<!DOCTYPE html>\n' + c.outerHTML], {type:'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { alert('Téléchargement impossible : ' + (e && e.message || e)); }
}

owner = location.hash === '#edit';
render();
</script>
